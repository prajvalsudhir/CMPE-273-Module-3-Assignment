syntax = "proto3";

package inventory;

// Contract for the Inventory Service (gRPC version).
service InventoryService {
  rpc CheckInventory(CheckRequest) returns (CheckResponse);
}

message CheckRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message CheckResponse {
  bool available = 1;
  int32 stock = 2;
}
